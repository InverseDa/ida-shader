iris.features.required=ENTITY_TRANSLUCENT PER_BUFFER_BLENDING SSBO COMPUTE_SHADERS
#if PLACED_LIGHTS == 1
bufferObject.0=1064960
bufferObject.1=2113536
bufferObject.2=131072
bufferObject.3=15204608
#if LOCAL_LIGHT_SHADOWS == 0
program.world0/shadowcomp1.enabled=false
program.world0/shadowcomp2.enabled=false
#endif
#else
program.world0/begin.enabled=false
program.world0/shadowcomp.enabled=false
program.world0/shadowcomp1.enabled=false
program.world0/shadowcomp2.enabled=false
#endif
# Iris supplies producer/consumer barriers between these passes.
allowConcurrentCompute=false
# Forward translucent entities must render after deferred lighting.
separateEntityDraws=true
clouds=off
oldHandLight=false
dynamicHandLight=false
# A geometry shader otherwise makes Iris infer voxelization and disable
# shadow frustum culling even in the legacy, pass-through configuration.
#if SHADOW_CSM == 1 || PLACED_LIGHTS == 1
shadow.culling=false
#else
shadow.culling=true
#endif
texture.noise=lib/textures/noise.png

screen=[MATERIALS] [LIGHTING] [COLOR] [STABILITY] [NATURE] [VOLUMETRICS] [WEATHER] [WATER]
screen.VOLUMETRICS=VOLUMETRIC_LIGHT VOLUMETRIC_LIGHT_STRENGTH VOLUMETRIC_LIGHT_SAMPLES
screen.WATER=SHORE_FOAM SHORE_FOAM_STRENGTH
screen.WEATHER=SURFACE_WETNESS SURFACE_WETNESS_STRENGTH PUDDLE_REFLECTIONS
screen.NATURE=CLOUD_STYLE CLOUD_SAMPLES CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH VEGETATION_TRANSMISSION VEGETATION_TRANSMISSION_STRENGTH
screen.STABILITY=SPECULAR_AA DYNAMIC_AA_STRENGTH SSR_TRACE_STEPS SSR_TEMPORAL REFLECTION_CLOUDS
screen.MATERIALS=MATERIAL_MODE
screen.LIGHTING=DIRECT_LIGHT_STRENGTH LIGHTMAP_STRENGTH DAY_SKY_LIGHTMAP SKY_AMBIENT_STRENGTH SHADOW_RECEIVER_PLANE SHADOW_CSM [LOCAL_LIGHTS]
screen.LOCAL_LIGHTS=LOCAL_LIGHT PLACED_LIGHTS LOCAL_LIGHT_STRENGTH LOCAL_LIGHT_SHADOWS
screen.COLOR=EXPOSURE BLOOM_STRENGTH BLOOM_THRESHOLD COLOR_CONTRAST COLOR_VIBRANCE COLOR_SATURATION
sliders=LOCAL_LIGHT_STRENGTH DIRECT_LIGHT_STRENGTH LIGHTMAP_STRENGTH DAY_SKY_LIGHTMAP SKY_AMBIENT_STRENGTH EXPOSURE BLOOM_STRENGTH BLOOM_THRESHOLD COLOR_CONTRAST COLOR_VIBRANCE COLOR_SATURATION SPECULAR_AA DYNAMIC_AA_STRENGTH CLOUD_SHADOW_STRENGTH VEGETATION_TRANSMISSION_STRENGTH SURFACE_WETNESS_STRENGTH SHORE_FOAM_STRENGTH VOLUMETRIC_LIGHT_STRENGTH

# CPU smoothing; no render history. Iris 1.8.8 SmoothFloat scales these values
# by 0.1: approximately 12 s wetting / 48 s drying halflives after rain changes.
# Camera-biome precipitation is a regional approximation, not per-block weather.
uniform.float.surfaceWetness = smooth(if(biome_precipitation == 1, rainStrength, 0.0), 120.0, 480.0)

# Bloom runs at half width and height.
size.buffer.colortex6=0.5 0.5
size.buffer.colortex7=0.5 0.5
# Iris blend/alphaTest keys use the bare program name, even in world0/.
# Metadata alpha stores a material ID + sky level, never coverage.
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex5=off
blend.gbuffers_entities.colortex9=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_hand.colortex5=off
blend.gbuffers_skybasic.colortex2=off
blend.gbuffers_skybasic.colortex5=off
blend.gbuffers_skytextured.colortex2=off
blend.gbuffers_skytextured.colortex5=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_terrain.colortex5=off
blend.gbuffers_terrain.colortex9=off

# Opaque particles enter deferred; translucent particles use forward lighting.
particles.ordering=mixed
blend.gbuffers_block.colortex2=off
blend.gbuffers_block.colortex5=off
blend.gbuffers_block.colortex9=off
blend.gbuffers_particles.colortex2=off
blend.gbuffers_particles.colortex5=off
blend.gbuffers_particles.colortex9=off
blend.gbuffers_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex10=ONE ONE ONE ONE
blend.gbuffers_hand_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex10=ONE ONE ONE ONE
blend.gbuffers_entities_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex10=ONE ONE ONE ONE
blend.gbuffers_block_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex10=ONE ONE ONE ONE
blend.gbuffers_weather.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex10=ONE ONE ONE ONE
blend.gbuffers_particles_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex10=ONE ONE ONE ONE

# Underwater absorption/scattering is supplied by the shader, not a flat overlay.
underwaterOverlay=false
# Beams are effects, not opaque surfaces for SSAO/refraction/depth history.
beacon.beam.depth=false

# The first-person hand covers earlier world effects; other occlusion uses temporary depth in buffer 3.
blend.gbuffers_hand.colortex1=off

# Premultiplied early/late effects; alpha zero denotes additive emission.
alphaTest.gbuffers_armor_glint=off
blend.gbuffers_armor_glint.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_armor_glint.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_armor_glint.colortex10=ONE ONE ONE ONE
alphaTest.gbuffers_spidereyes=off
blend.gbuffers_spidereyes.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_spidereyes.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_spidereyes.colortex10=ONE ONE ONE ONE
alphaTest.gbuffers_beaconbeam=off
blend.gbuffers_beaconbeam.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam.colortex10=ONE ONE ONE ONE
alphaTest.gbuffers_line=off
blend.gbuffers_line.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_line.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_line.colortex10=ONE ONE ONE ONE
alphaTest.gbuffers_textured_lit=off
blend.gbuffers_textured_lit.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit.colortex10=ONE ONE ONE ONE
alphaTest.gbuffers_basic=off
blend.gbuffers_basic.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_basic.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_basic.colortex10=ONE ONE ONE ONE
alphaTest.gbuffers_textured=off
blend.gbuffers_textured.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured.colortex10=ONE ONE ONE ONE

alphaTest.gbuffers_damagedblock=off
blend.gbuffers_damagedblock.colortex0=DST_COLOR ZERO ZERO ONE
blend.gbuffers_damagedblock.colortex10=ONE ONE ONE ONE
blend.gbuffers_lightning.colortex0=off
blend.gbuffers_lightning.colortex2=off
blend.gbuffers_lightning.colortex5=off
blend.gbuffers_lightning.colortex10=ONE ONE ONE ONE
blend.gbuffers_basic.colortex3=off
blend.gbuffers_textured.colortex3=off
blend.gbuffers_textured_lit.colortex3=off
blend.gbuffers_line.colortex3=off
blend.gbuffers_armor_glint.colortex3=off
blend.gbuffers_spidereyes.colortex3=off
blend.gbuffers_beaconbeam.colortex3=off

# Reflection scratch is data, never alpha blended. History 12/13/14 is read-only
# during geometry and committed by composite1 with its automatic buffer flips.
#if SSR_TEMPORAL == 1
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex3=off
blend.gbuffers_water.colortex15=off
#endif

#if SSR_TEMPORAL == 1
# Four times fewer persistent reflection pixels; geometry scratch stays full size.
size.buffer.colortex12=0.5 0.5
size.buffer.colortex13=0.5 0.5
size.buffer.colortex14=0.5 0.5

#else
program.world0/composite1.enabled=false
size.buffer.colortex12=1 1
size.buffer.colortex13=1 1
size.buffer.colortex14=1 1
size.buffer.colortex15=1 1
#endif
