iris.features.required=ENTITY_TRANSLUCENT PER_BUFFER_BLENDING
clouds=off
texture.noise=lib/textures/noise.png

# Bloom runs at half width and height.
size.buffer.colortex6=0.5 0.5
size.buffer.colortex7=0.5 0.5
blend.world0/gbuffers_entities.colortex2=off
blend.world0/gbuffers_entities.colortex5=off
blend.world0/gbuffers_entities.colortex9=off
blend.world0/gbuffers_hand.colortex2=off
blend.world0/gbuffers_hand.colortex5=off
blend.world0/gbuffers_hand.colortex9=off
blend.world0/gbuffers_skybasic.colortex2=off
blend.world0/gbuffers_skybasic.colortex5=off
blend.world0/gbuffers_skybasic.colortex9=off
blend.world0/gbuffers_skytextured.colortex2=off
blend.world0/gbuffers_skytextured.colortex5=off
blend.world0/gbuffers_skytextured.colortex9=off
blend.world0/gbuffers_terrain.colortex2=off
blend.world0/gbuffers_terrain.colortex5=off
blend.world0/gbuffers_terrain.colortex9=off

# Opaque particles enter deferred; translucent particles use forward lighting.
particles.ordering=mixed
blend.world0/gbuffers_block.colortex2=off
blend.world0/gbuffers_block.colortex5=off
blend.world0/gbuffers_block.colortex9=off
blend.world0/gbuffers_particles.colortex2=off
blend.world0/gbuffers_particles.colortex5=off
blend.world0/gbuffers_particles.colortex9=off
blend.world0/gbuffers_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_water.colortex10=ONE ONE ONE ONE
blend.world0/gbuffers_hand_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_hand_water.colortex10=ONE ONE ONE ONE
blend.world0/gbuffers_entities_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_entities_translucent.colortex10=ONE ONE ONE ONE
blend.world0/gbuffers_block_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_block_translucent.colortex10=ONE ONE ONE ONE
blend.world0/gbuffers_weather.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_weather.colortex10=ONE ONE ONE ONE
blend.world0/gbuffers_particles_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_particles_translucent.colortex10=ONE ONE ONE ONE

# Underwater absorption/scattering is supplied by the shader, not a flat overlay.
underwaterOverlay=false
# Beams are effects, not opaque surfaces for SSAO/refraction/depth history.
beacon.beam.depth=false

# The first-person hand covers earlier world effects; other occlusion uses temporary depth in buffer 3.
blend.world0/gbuffers_hand.colortex1=off

# Premultiplied early/late effects; alpha zero denotes additive emission.
alphaTest.world0/gbuffers_armor_glint=off
blend.world0/gbuffers_armor_glint.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_armor_glint.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_armor_glint.colortex10=ONE ONE ONE ONE
alphaTest.world0/gbuffers_spidereyes=off
blend.world0/gbuffers_spidereyes.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_spidereyes.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_spidereyes.colortex10=ONE ONE ONE ONE
alphaTest.world0/gbuffers_beaconbeam=off
blend.world0/gbuffers_beaconbeam.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_beaconbeam.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_beaconbeam.colortex10=ONE ONE ONE ONE
alphaTest.world0/gbuffers_line=off
blend.world0/gbuffers_line.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_line.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_line.colortex10=ONE ONE ONE ONE
alphaTest.world0/gbuffers_textured_lit=off
blend.world0/gbuffers_textured_lit.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_textured_lit.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_textured_lit.colortex10=ONE ONE ONE ONE
alphaTest.world0/gbuffers_basic=off
blend.world0/gbuffers_basic.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_basic.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_basic.colortex10=ONE ONE ONE ONE
alphaTest.world0/gbuffers_textured=off
blend.world0/gbuffers_textured.colortex0=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_textured.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world0/gbuffers_textured.colortex10=ONE ONE ONE ONE

alphaTest.world0/gbuffers_damagedblock=off
blend.world0/gbuffers_damagedblock.colortex0=DST_COLOR ZERO ZERO ONE
blend.world0/gbuffers_damagedblock.colortex10=ONE ONE ONE ONE
blend.world0/gbuffers_lightning.colortex0=off
blend.world0/gbuffers_lightning.colortex2=off
blend.world0/gbuffers_lightning.colortex5=off
blend.world0/gbuffers_lightning.colortex10=ONE ONE ONE ONE
blend.world0/gbuffers_basic.colortex3=off
blend.world0/gbuffers_textured.colortex3=off
blend.world0/gbuffers_textured_lit.colortex3=off
blend.world0/gbuffers_line.colortex3=off
blend.world0/gbuffers_armor_glint.colortex3=off
blend.world0/gbuffers_spidereyes.colortex3=off
blend.world0/gbuffers_beaconbeam.colortex3=off
